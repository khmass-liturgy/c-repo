<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>ScoreAttach — static preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap">
</head>
<body>
<div class="ds-pad" style="max-width:520px">
  <span class="modal-label">악보 파일 · Supabase 저장</span>
  <div class="score-file-row">
    <label class="score-file-label">파일 선택</label>
    <a class="score-file-open" href="#">악보 열기</a>
    <button class="score-file-delete">파일 삭제</button>
    <span class="score-file-meta">Recuerdos de la Alhambra.pdf · 1.2MB</span>
  </div>
  <div class="score-hint">비공개 저장 · PDF/JPG/PNG/WebP · 파일당 최대 20MB</div>
  <details class="legacy-score-details" open>
    <summary>기존 공유 링크</summary>
    <div class="score-link-row"><input class="score-link-input" id="sa-link" type="url" placeholder="기존 공유 링크" aria-label="악보 링크"><a class="score-open-btn" href="#">열기</a></div>
  </details>
</div>
</body>
</html>
