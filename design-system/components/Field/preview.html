<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Field — static preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap">
</head>
<body>
<div class="ds-pad" style="max-width:460px">
  <div class="form-row">
    <label class="form-label" for="f-title">곡명</label>
    <input class="form-input" id="f-title" value="알함브라 궁전의 추억">
  </div>
  <div class="form-row">
    <label class="form-label" for="f-cat">카테고리</label>
    <select class="form-select" id="f-cat"><option>낭만</option><option>바로크</option></select>
  </div>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input class="search-input" id="f-search" placeholder="곡명·작곡가 검색" aria-label="검색">
  </div>
</div>
</body>
</html>
