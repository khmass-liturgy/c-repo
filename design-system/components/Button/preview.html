<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Buttons — static preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap">
</head>
<body>
<div class="ds-pad ds-stack">
  <div class="ds-row">
    <button class="hdr-btn hdr-btn-ghost">가져오기</button>
    <button class="hdr-btn hdr-btn-print">인쇄</button>
    <button class="hdr-btn hdr-btn-cloud"><span>계정 동기화</span></button>
    <button class="cat-action-btn" aria-label="곡 추가">＋</button>
    <button class="cat-action-btn del" aria-label="카테고리 삭제">×</button>
  </div>
  <div class="ds-row">
    <button class="btn-danger">삭제</button>
    <button class="btn-ghost">취소</button>
    <button class="btn-primary">저장</button>
  </div>
  <div class="ds-row">
    <button class="timer-btn primary">시작</button>
    <button class="timer-btn">초기화</button>
    <button class="duration-pill">15분</button>
    <button class="duration-pill active">30분</button>
    <button class="duration-pill">60분</button>
  </div>
</div>
</body>
</html>
