<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>StatusBadge — static preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap">
</head>
<body>
<div class="ds-pad ds-row" style="gap:var(--space-14)">
  <button class="status-badge status-암보">암보</button>
  <button class="status-badge status-연습중">연습중</button>
  <button class="status-badge status-완성">완성</button>
  <button class="status-badge status-공연가능">공연가능</button>
  <span class="last-played">3일 전</span>
  <span class="last-played warning">16일 전</span>
  <span class="last-played danger">41일 전</span>
</div>
</body>
</html>
