<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>ConcertPlan — static preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap">
</head>
<body>
<div class="ds-pad">
  <div class="concert-topline"><div><h2>연주회 준비</h2><p>연주 순서와 멘트 시간을 더해 전체 길이를 확인합니다.</p></div><button class="btn-primary">＋ 새 연주회</button></div>
  <section class="concert-plan">
    <div class="concert-plan-head">
      <div class="concert-plan-title"><input id="c-title" value="성탄 음악회" aria-label="연주회 이름"></div>
      <div class="concert-plan-summary">2곡 · 음악 6분 40초 + 멘트 2분 = 총 8분 40초</div>
    </div>
    <div class="concert-plan-grid">
      <div class="form-row"><label class="form-label" for="c-date">연주 날짜</label><input class="form-input" id="c-date" value="2026-12-24"></div>
      <div class="form-row"><label class="form-label" for="c-time">연주 시간</label><input class="form-input" id="c-time" value="19:30"></div>
      <div class="form-row"><label class="form-label" for="c-venue">연주 장소</label><input class="form-input" id="c-venue" placeholder="예: 성당 대성전"></div>
    </div>
    <div class="concert-piece-panel">
      <div class="concert-piece-head"><strong>연주 순서</strong><span class="concert-total">곡 시간 6분 40초</span></div>
      <div class="concert-piece-list">
        <div class="concert-piece-row"><span class="concert-piece-index">1</span><span class="concert-piece-name">라그리마</span><span class="concert-piece-meta">2분 10초</span><span class="concert-piece-actions"><button class="concert-icon-btn" aria-label="위로">▲</button><button class="concert-icon-btn" aria-label="아래로">▼</button><button class="concert-icon-btn" aria-label="빼기">×</button></span><div class="concert-piece-ment"><div><label for="c-ment1">곡 전 멘트</label><textarea class="form-input" id="c-ment1" placeholder="이 곡 전에 할 멘트를 적어주세요.">오늘 첫 곡은 타레가의 작은 전주곡입니다.</textarea></div><div><label for="c-mt1">멘트 시간</label><input class="form-input" id="c-mt1" value="1분"></div></div></div>
        <div class="concert-piece-row"><span class="concert-piece-index">2</span><span class="concert-piece-name">알함브라 궁전의 추억</span><span class="concert-piece-meta">4분 30초</span><span class="concert-piece-actions"><button class="concert-icon-btn" aria-label="위로">▲</button><button class="concert-icon-btn" aria-label="아래로">▼</button><button class="concert-icon-btn" aria-label="빼기">×</button></span></div>
      </div>
    </div>
    <div class="concert-note"><label class="form-label" for="c-note">연주회 전체 멘트</label><textarea class="form-input" id="c-note"></textarea></div>
    <div class="concert-plan-actions"><button class="btn-primary">완료 후 보관</button><button class="btn-ghost concert-delete">연주회 삭제</button></div>
  </section>
</div>
</body>
</html>
