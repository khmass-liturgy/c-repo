<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Header — static preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap">
</head>
<body>
<div class="ds-pad" style="padding-top:0"><header class="app-header">
  <div class="header-top">
    <div><div class="header-label">Classical Guitar Practice Studio</div><h1>나의 <em>연습실</em></h1></div>
    <div class="header-actions">
      <button class="hdr-btn hdr-btn-ghost">＋ 카테고리</button>
      <button class="hdr-btn hdr-btn-cloud connected"><span class="sync-dot synced"></span><span>계정 연결됨</span></button>
      <button class="hdr-btn hdr-btn-print">인쇄 (PDF)</button>
    </div>
  </div>
  <div class="header-stats">
    <div class="stat"><span class="stat-num">42</span><span class="stat-label">Total</span></div>
    <div class="stat"><span class="stat-num">2시간 48분</span><span class="stat-label">전체시간</span></div>
    <div class="stat"><span class="stat-num">17</span><span class="stat-label">공연가능</span></div>
    <div class="stat"><span class="stat-num">1시간 05분</span><span class="stat-label">공연가능 시간</span></div>
    <div class="stat"><span class="stat-num">9</span><span class="stat-label">연습중</span></div>
    <div class="stat"><span class="stat-num">23</span><span class="stat-label">공연이력</span></div>
  </div>
  <div class="sync-status-text" style="margin-top:8px">방금 저장됨</div>
</header></div>
</body>
</html>
