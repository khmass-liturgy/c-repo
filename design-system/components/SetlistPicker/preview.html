<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>SetlistPicker — static preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap">
</head>
<body>
<div class="modal-overlay open" style="position:relative;min-height:500px"><div class="modal" style="max-width:520px" role="dialog" aria-label="곡 선택">
  <div class="modal-title" style="margin-bottom:4px">곡 선택</div>
  <div class="panel-note" style="margin:0 0 14px">공연 프로그램에 추가</div>
  <div class="setlist-picker-search-wrap"><span class="setlist-picker-search-icon">⌕</span><input class="setlist-picker-search" id="sp-search" placeholder="곡명 또는 작곡자 검색..." aria-label="검색"></div>
  <div class="setlist-cat-group">
    <div class="setlist-cat-label">낭만</div>
    <div class="setlist-item"><span class="setlist-check checked">✓</span><span class="setlist-item-title">알함브라 궁전의 추억</span><span class="setlist-item-composer">F. Tárrega</span><span class="setlist-item-status">공연가능</span></div>
    <div class="setlist-item"><span class="setlist-check">✓</span><span class="setlist-item-title">라그리마</span><span class="setlist-item-composer">F. Tárrega</span><span class="setlist-item-status">완성</span></div>
    <div class="setlist-item already-in"><span class="setlist-check">✓</span><span class="setlist-item-title">아스투리아스</span><span class="setlist-item-composer">I. Albéniz</span><span class="setlist-item-status">연습중</span></div>
  </div>
  <div class="setlist-selected-count">1곡 선택됨</div>
  <div class="modal-footer" style="margin-top:12px"><div></div><div class="footer-right"><button class="btn-ghost">취소</button><button class="btn-primary">추가</button></div></div>
</div></div>
</body>
</html>
