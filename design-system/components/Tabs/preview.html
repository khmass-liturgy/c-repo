<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Tabs — static preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap">
</head>
<body>
<div class="ds-pad ds-stack">
  <div class="tab-bar" role="tablist">
    <button class="tab-btn active" role="tab" aria-selected="true">레퍼토리 관리</button>
    <button class="tab-btn" role="tab">오늘의 연습</button>
    <button class="tab-btn" role="tab">연주회 준비</button>
    <button class="tab-btn" role="tab">악보 자료실</button>
    <button class="tab-btn" role="tab">공연 이력</button>
  </div>
  <div class="cat-tab-bar" role="tablist">
    <button class="cat-tab active" role="tab" aria-selected="true">전체 <span class="tab-count">42</span></button>
    <button class="cat-tab" role="tab">바로크 <span class="tab-count">9</span></button>
    <button class="cat-tab" role="tab">고전 <span class="tab-count">11</span></button>
    <button class="cat-tab" role="tab">낭만 <span class="tab-count">14</span></button>
    <button class="cat-tab" role="tab">현대 <span class="tab-count">8</span></button>
  </div>
</div>
</body>
</html>
