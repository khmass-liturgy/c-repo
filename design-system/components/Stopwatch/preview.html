<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Stopwatch — static preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap">
</head>
<body>
<div class="ds-pad" style="max-width:380px"><section class="practice-panel">
  <div class="performance-stopwatch">
    <div class="metronome-head"><div><div class="metronome-title">⏱ 연주시간 타이머</div><div class="metronome-sub">곡을 처음부터 끝까지 연주한 시간을 측정합니다</div></div></div>
    <div class="performance-clock">04:27.3</div>

  </div>
</section></div>
