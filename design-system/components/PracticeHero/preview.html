<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>PracticeHero — static preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap">
</head>
<body>
<div class="ds-pad"><section class="practice-hero">
  <div class="eyebrow">Professional practice, made personal</div>
  <h2>많이 치는 연습보다<br><span>정확히 남는 연습</span></h2>
  <p class="practice-sub">현재 레퍼토리의 완성도와 마지막 연주일을 분석해 오늘의 집중곡과 유지곡을 자동으로 고릅니다. 짧은 목표, 느린 정확성, 교차 반복, 모의 연주 순서로 구성했습니다.</p>
  <div class="practice-toolbar">
    <div class="practice-control">
      <span class="control-label">오늘 가능한 시간</span>
      <div class="duration-pills"><button class="duration-pill">15분</button><button class="duration-pill active">30분</button><button class="duration-pill">45분</button><button class="duration-pill">60분</button></div>
    </div>
    <div class="practice-control">
      <label for="ph-goal">오늘의 목표</label>
      <select class="goal-select" id="ph-goal"><option>균형 연습</option><option>공연 준비</option></select>
    </div>
    <div class="practice-summary"><strong>30분 · 3곡</strong><span>집중곡 1곡, 유지곡 2곡</span></div>
  </div>
</section></div>
</body>
</html>
