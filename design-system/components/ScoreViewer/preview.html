<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>ScoreViewer — static preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap">
</head>
<body>
<div class="score-viewer open" style="position:relative;height:320px" role="dialog" aria-label="악보 보기">
  <div class="score-viewer-bar">
    <button class="score-viewer-button" aria-label="악보 닫기">✕</button>
    <strong class="score-viewer-title">Recuerdos de la Alhambra.pdf</strong>
    <button class="score-viewer-button">전체 화면</button>
  </div>
  <div class="score-viewer-stage"><div style="width:180px;margin:16px 0;background:#fff" aria-label="악보 페이지 자리"></div></div>
</div>
</body>
</html>
