<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>ScoreLibrary — static preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap">
</head>
<body>
<div class="ds-pad"><div class="score-library-layout">
  <nav class="score-library-categories" aria-label="악보 카테고리">
    <button class="score-library-category active">낭만</button>
    <button class="score-library-category">바로크</button>
    <button class="score-library-category">연습곡</button>
  </nav>
  <section class="score-library-panel">
    <div class="score-library-panel-head"><h3>낭만</h3><div class="score-library-actions"><label class="score-file-label">악보 올리기</label></div></div>
    <div class="score-library-list">
      <div class="score-library-item"><div><div class="score-library-item-title">Recuerdos de la Alhambra.pdf</div><div class="score-library-item-meta">PDF · 1.2MB</div></div><div class="score-library-item-actions"><a class="score-file-open" href="#">열기</a><button class="score-file-delete">삭제</button></div></div>
      <div class="score-library-item"><div><div class="score-library-item-title">Lagrima.pdf</div><div class="score-library-item-meta">PDF · 0.4MB</div></div><div class="score-library-item-actions"><a class="score-file-open" href="#">열기</a><button class="score-file-delete">삭제</button></div></div>
    </div>
  </section>
</div></div>
</body>
</html>
