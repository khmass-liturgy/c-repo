<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Calendar — static preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap">
</head>
<body>
<div class="ds-pad"><div style="position:relative;display:inline-block">
  <button class="date-trigger open"><span class="dt-icon">📅</span><span class="dt-val">2026.11.15</span></button>
  <div class="cal-popup open" style="position:relative;top:6px">
    <div class="cal-nav"><button class="cal-nav-btn" aria-label="이전 달">‹</button><span class="cal-month-label">2026년 11월</span><button class="cal-nav-btn" aria-label="다음 달">›</button></div>
    <div class="cal-dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div class="cal-grid"><span class="cal-day sun">1</span><span class="cal-day">2</span><span class="cal-day">3</span><span class="cal-day">4</span><span class="cal-day">5</span><span class="cal-day">6</span><span class="cal-day">7</span><span class="cal-day sun">8</span><span class="cal-day">9</span><span class="cal-day">10</span><span class="cal-day">11</span><span class="cal-day today">12</span><span class="cal-day">13</span><span class="cal-day">14</span><span class="cal-day sun selected">15</span><span class="cal-day">16</span><span class="cal-day">17</span><span class="cal-day">18</span><span class="cal-day">19</span><span class="cal-day">20</span><span class="cal-day">21</span><span class="cal-day sun">22</span><span class="cal-day">23</span><span class="cal-day">24</span><span class="cal-day">25</span><span class="cal-day">26</span><span class="cal-day">27</span><span class="cal-day">28</span><span class="cal-day sun">29</span><span class="cal-day">30</span><span class="cal-day other-month">1</span><span class="cal-day other-month">2</span><span class="cal-day other-month">3</span><span class="cal-day other-month">4</span><span class="cal-day other-month">5</span></div>
    <button class="cal-today-btn">오늘</button>
  </div>
</div></div>
</body>
</html>
