<!-- @dsCard group="Data" height=300 -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>PieceRow — static preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap">
</head>
<body>
<div class="ds-pad">
  <section class="category-section">
    <div class="category-header">
      <span class="cat-icon">🎼</span>
      <span class="cat-name">낭만</span>
      <span class="cat-count">3곡</span>
      <span class="cat-actions"><span class="cat-setlist-badge">공연 2곡</span>
        <button class="cat-action-btn" aria-label="곡 추가">＋</button>
        <button class="cat-action-btn del" aria-label="카테고리 삭제">×</button>
        <span class="cat-chevron">▼</span>
      </span>
    </div>
    <div class="piece-list">
      <div class="piece-item">
        <div class="reorder-controls"><button class="reorder-btn" aria-label="위로">▲</button><button class="reorder-btn" aria-label="아래로">▼</button></div>
        <div class="piece-info"><span class="piece-title has-score">알함브라 궁전의 추억</span><span class="piece-composer">F. Tárrega</span></div>
        <a class="score-btn" href="#">악보</a>
        <span class="piece-duration">4분 30초</span>
        <button class="status-badge status-공연가능">공연가능</button>
        <span class="last-played">3일 전</span>
        <button class="record-btn" aria-label="오늘 연주 기록">▶</button>
        <button class="piece-del-btn" aria-label="곡 삭제">×</button>
      </div>
      <div class="piece-item">
        <div class="reorder-controls"><button class="reorder-btn" aria-label="위로">▲</button><button class="reorder-btn" aria-label="아래로">▼</button></div>
        <div class="piece-info"><span class="piece-title">라그리마</span><span class="piece-composer">F. Tárrega</span></div>
        <span class="piece-duration">2분 10초</span>
        <button class="status-badge status-완성">완성</button>
        <span class="last-played warning">16일 전</span>
        <button class="record-btn" aria-label="오늘 연주 기록">▶</button>
        <button class="piece-del-btn" aria-label="곡 삭제">×</button>
      </div>
      <div class="piece-item">
        <div class="reorder-controls"><button class="reorder-btn" aria-label="위로">▲</button><button class="reorder-btn" aria-label="아래로">▼</button></div>
        <div class="piece-info"><span class="piece-title">아스투리아스</span><span class="piece-composer">I. Albéniz</span></div>
        <span class="piece-duration">6분 20초</span>
        <button class="status-badge status-연습중">연습중</button>
        <span class="last-played danger">41일 전</span>
        <button class="record-btn" aria-label="오늘 연주 기록">▶</button>
        <button class="piece-del-btn" aria-label="곡 삭제">×</button>
      </div>
    </div>
    <div class="cat-duration-footer"><span>카테고리 합계</span><span class="cat-duration-total">13분 00초</span></div>
  </section>
</div>
</body>
</html>
